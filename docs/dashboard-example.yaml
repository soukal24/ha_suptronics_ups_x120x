# Example view for the Suptronics X120x UPS, version 3.0.
#
# Paste it into a dashboard in YAML mode (or copy the parts you want into the
# UI editor). The UPS entity ids are fixed by the integration and are the
# same on every install, whatever the language. The System Monitor entities
# in the last card are named by Home Assistant from the language in use when
# they were created, so adjust those to your install (the UPS card itself
# finds them on its own).
#
# Ukázkový pohled pro UPS Suptronics X120x, verze 3.0. ID entit UPS jsou
# pevná a stejná všude. Entity System Monitoru v poslední kartě si HA
# pojmenovává podle jazyka, ty si upravte (karta UPS si je najde sama).

title: Performance
icon: mdi:poll
badges:
  # Status of the UPS: shows the translated state and changes colour with it.
  - type: entity
    entity: sensor.ups_status
    show_name: false
    show_state: true
    show_icon: true
    color: green
    visibility:
      - condition: state
        entity: sensor.ups_status
        state: online
  - type: entity
    entity: sensor.ups_status
    show_name: false
    show_state: true
    show_icon: true
    color: blue
    visibility:
      - condition: state
        entity: sensor.ups_status
        state: charging
  - type: entity
    entity: sensor.ups_status
    show_name: false
    show_state: true
    show_icon: true
    color: amber
    visibility:
      - condition: state
        entity: sensor.ups_status
        state: on_battery
  - type: entity
    entity: sensor.ups_status
    show_name: false
    show_state: true
    show_icon: true
    color: red
    visibility:
      - condition: state
        entity: sensor.ups_status
        state:
          - low_battery
          - shutting_down
  - type: entity
    entity: sensor.ups_battery_level
    show_name: false
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.ups_runtime_estimate
    show_name: false
    show_state: true
    show_icon: true
  # Battery voltage, coloured by band.
  - type: entity
    entity: sensor.ups_battery_voltage
    show_name: false
    show_state: true
    show_icon: true
    color: red
    icon: mdi:battery-alert
    visibility:
      - condition: numeric_state
        entity: sensor.ups_battery_voltage
        below: 3.55
  - type: entity
    entity: sensor.ups_battery_voltage
    show_name: false
    show_state: true
    show_icon: true
    color: accent
    icon: mdi:battery-charging-50
    visibility:
      - condition: numeric_state
        entity: sensor.ups_battery_voltage
        above: 3.55
        below: 3.9
  - type: entity
    entity: sensor.ups_battery_voltage
    show_name: false
    show_state: true
    show_icon: true
    color: green
    icon: mdi:battery-charging-100
    visibility:
      - condition: numeric_state
        entity: sensor.ups_battery_voltage
        above: 3.9

cards:
  # The UPS card with the System Monitor gauges as extra mini dials. The
  # card finds the System Monitor entities itself; to pick your own entities
  # or thresholds, replace `system_monitor` with a list (see the README).
  - type: custom:suptronics-ups-card
    variant: full
    hours: 24
    extras: system_monitor

  # Classic gauges, kept for those who like them.
  - type: gauge
    entity: sensor.ups_battery_voltage
    name: Napětí baterie
    unit: V
    min: 3.4
    max: 4.4
    needle: true
    severity: { green: 3.9, yellow: 3.55, red: 0 }
  - type: gauge
    entity: sensor.ups_battery_level
    name: Stav baterie
    unit: "%"
    min: 0
    max: 100
    needle: true
    severity: { green: 50, yellow: 25, red: 0 }

  # Everything about the UPS in one list.
  - type: entities
    title: UPS
    entities:
      - entity: sensor.ups_status
      - entity: binary_sensor.ups_ac_power
      - entity: binary_sensor.ups_battery_charging
      - entity: sensor.ups_runtime_estimate
      - entity: sensor.ups_time_on_battery
      - entity: sensor.ups_last_power_loss
      - entity: sensor.ups_power_outages
      - type: divider
      - entity: switch.ups_charging_on_off
      - entity: number.ups_charge_limit_min
      - entity: number.ups_charge_limit_max
      - type: divider
      - entity: switch.ups_auto_shutdown
      - entity: number.ups_shutdown_below
      - entity: number.ups_shutdown_after_minutes

  - type: history-graph
    title: Napájení ze sítě
    hours_to_show: 24
    entities:
      - entity: binary_sensor.ups_ac_power
      - entity: sensor.ups_battery_level

  - type: entities
    title: Raspberry Pi
    entities:
      - entity: sensor.disk_free
      - entity: sensor.disk_use
      - entity: sensor.memory_free
      - entity: sensor.memory_use
      - entity: binary_sensor.rpi_power_status
      - entity: sensor.last_boot
